<!doctype html>

  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Daily reps in Lean 4 and formal methods. Short lessons, a streak, and every answer checked by real Lean running in your browser." />
    <meta name="theme-color" content="#2b2272" />
    <link rel="canonical" href="https://tobilehman.com/ProofReps/" />

    <!-- Link previews: iMessage, WhatsApp, Slack, Android, X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProofReps" />
    <meta property="og:title" content="ProofReps ⊢💪" />

    <meta property="og:url" content="https://tobilehman.com/ProofReps/" />
    <meta property="og:image" content="https://tobilehman.com/ProofReps/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ProofReps: a turnstile and a flexed arm" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tobilehman.com/ProofReps/og.png" />

    <!-- Home screen: iOS and Android -->
    <link rel="manifest" href="/ProofReps/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/ProofReps/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/ProofReps/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/ProofReps/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ProofReps" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style id="expo-reset">
      /* The page itself never scrolls, zooms or slides sideways: it's pinned to
         the viewport and each screen's ScrollView does the scrolling. The
         padding keeps content out from under the status bar and home
         indicator (viewport-fit=cover + black-translucent draw under them). */
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
      body { position: fixed; inset: 0; margin: 0; background: #f7f6fb; touch-action: pan-x pan-y; }
      @media (prefers-color-scheme: dark) { body { background: #14102e; } }
      #root {
        display: flex; flex: 1; height: 100%; box-sizing: border-box; overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
    <script>
      // iOS Safari ignores user-scalable=no, so pinch zoom is cancelled by
      // hand. (touch-action: pan-x pan-y on body stops double-tap zoom.)
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
    </script>
    <script>
      // Lean's WebAssembly needs SharedArrayBuffer, which needs a cross-origin
      // isolated page, which needs COOP/COEP headers that GitHub Pages can't
      // send. The service worker (sw.js) adds them and caches the Lean runtime.
      // The first visit runs without it, so reload once it takes control.
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var isolated = window.crossOriginIsolated === true;
        var KEY = "proofreps:sw-reload";
        navigator.serviceWorker.register("/ProofReps/sw.js", { scope: "/ProofReps/" }).then(function (reg) {
          reg.update().catch(function () {});
          if (!isolated && navigator.serviceWorker.controller && !sessionStorage.getItem(KEY)) {
            sessionStorage.setItem(KEY, "1");
            location.reload();
          }
        }, function (e) { console.warn("service worker:", e); });
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!isolated) {
            if (!sessionStorage.getItem(KEY)) { sessionStorage.setItem(KEY, "1"); location.reload(); }
          } else if (hadController) {
            window.dispatchEvent(new Event("proofreps-update"));
          }
        });
        if (isolated) sessionStorage.removeItem(KEY);
      })();
    </script>
  </head>
  <body>
    <noscript>ProofReps needs JavaScript: it runs Lean 4 in your browser.</noscript>
    <div id="root"></div>
  </body>
</html>
