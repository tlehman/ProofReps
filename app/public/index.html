<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>ProofReps ⊢💪</title>
    <meta name="description" content="Daily reps in Lean 4 and formal methods. Short lessons, a streak, and every answer checked by real Lean 4 and Mathlib on your own server." />
    <meta name="theme-color" content="#2b2272" />

    <!-- Link previews: iMessage, WhatsApp, Slack, Android, X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProofReps" />
    <meta property="og:title" content="ProofReps ⊢💪" />
    <meta property="og:description" content="Daily reps in Lean 4 and formal methods, checked by real Lean 4 and Mathlib on your own server." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ProofReps: a turnstile and a flexed arm" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />

    <!-- Home screen: iOS and Android -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ProofReps" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style id="expo-reset">
      /* The page itself never scrolls, zooms or slides sideways: it's pinned to
         the viewport and each screen's ScrollView does the scrolling. The
         padding keeps content out from under the status bar and home
         indicator (viewport-fit=cover + black-translucent draw under them). */
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
      body { position: fixed; inset: 0; margin: 0; background: #f7f6fb; touch-action: pan-x pan-y; }
      @media (prefers-color-scheme: dark) { body { background: #14102e; } }
      #root {
        display: flex; flex: 1; height: 100%; box-sizing: border-box; overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
    <script>
      // iOS Safari ignores user-scalable=no, so pinch zoom is cancelled by
      // hand. (touch-action: pan-x pan-y on body stops double-tap zoom.)
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
    </script>
    <script>
      // Earlier versions ran Lean in the browser behind a service worker. Lean
      // runs on the server now: drop any worker and its caches left behind.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
        if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf("proofreps-") === 0) caches.delete(k); }); }).catch(function () {});
      }
    </script>
  </head>
  <body>
    <noscript>ProofReps needs JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
